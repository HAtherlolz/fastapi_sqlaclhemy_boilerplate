[tool.poetry]
name = "fastapi-sqlalchemy-boilerplate"
version = "0.1.0"
description = "FastAPI SQLAlchemy async boilerplate with configured migrations and admin panel"
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.141.1"
uvicorn = {extras = ["standard"], version = "^0.52.1"}
sqlalchemy = "^2.0.51"
alembic = "^1.18.5"
asyncpg = "^0.31.0"
psycopg2-binary = "^2.9.12"
sqladmin = "^0.30.0"
pydantic = "^2.13.4"
pydantic-settings = "^2.14.2"
python-dotenv = "^1.2.2"
python-multipart = "^0.0.32"
email-validator = "^2.3.0"
jinja2 = "^3.1.6"
watchfiles = "^1.2.0"
websockets = "^17.0.1"
wtforms = "^3.2.2"
orjson = "^3.11.9"
ujson = "^5.13.0"
httpx = "^0.28.1"
starlette = "^1.3.1"
anyio = "^4.14.2"
click = "^8.4.2"
dnspython = "^2.8.0"
greenlet = "^3.5.4"
h11 = "^0.16.0"
httpcore = "^1.0.9"
httptools = "^0.8.0"
idna = "^3.18"
itsdangerous = "^2.2.0"
mako = "^1.3.12"
markupsafe = "^3.0.3"
pyyaml = "^6.0.3"
sniffio = "^1.3.1"
typing-extensions = "^4.16.0"
certifi = "^2026.7.22"
pyodbc = "^5.3.0"
sqlmodel = "^0.0.39"
dependency-injector = "^4.49.1"
passlib = {extras = ["argon2"], version = "^1.7.4"}
python-jose = {extras = ["cryptography"], version = "^3.5.0"}
bcrypt = "^5.0.0"


[tool.poetry.group.dev]
optional = true


[tool.poetry.group.dev.dependencies]
pre-commit = "^4.6.1"
ruff = "^0.16.1"
mypy = "^2.3.0"
pytest = "^9.1.1"
pytest-cov = "^7.1.0"
pytest-mock = "^3.15.1"
pytest-sugar = "^1.1.1"
pytest-asyncio = "^1.4.0"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"


# ---------------------------
# Ruff (lint + imports)
# ---------------------------
[tool.ruff]
line-length = 120
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []

[tool.ruff.lint.isort]
combine-as-imports = true
force-single-line = false
force-sort-within-sections = true
known-first-party = ["src"]
lines-after-imports = 2
split-on-trailing-comma = true


[tool.pytest.ini_options]
pythonpath = ["src"]


[tool.mypy]
python_version = "3.12"
namespace_packages = true
show_error_codes = true
ignore_missing_imports = true


[[tool.mypy.overrides]]
module = [
    "sqlalchemy.*",
    "alembic.*",
    "fastapi.*",
    "uvicorn.*",
    "pydantic.*",
    "pydantic_settings.*",
]
ignore_missing_imports = true
